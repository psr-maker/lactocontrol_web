name: Deploy LactoControl Flutter Web

on:
  push:
    branches:
      - main

# Prevents two pushes from racing and interleaving deployments
concurrency:
  group: deploy-lactocontrol-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      # 3. Install packages
      - name: Install Dependencies
        run: flutter pub get

      # 4. Build (clean build, no stale service-worker caching issues)
      - name: Build Flutter Web
        run: |
          flutter clean
          flutter pub get
          flutter build web --release --pwa-strategy=none

      # 5. Generate a unique release folder name for this deploy
      - name: Set release folder name
        id: vars
        run: echo "release=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # 6. Upload build into a NEW isolated release folder (old site stays live and untouched)
      - name: Upload build to new release folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "build/web/*"
          target: "/var/www/lactocontrol_releases/${{ steps.vars.outputs.release }}"
          strip_components: 2

      # 7. Atomically switch the live symlink to the new release, then clean up old ones
      - name: Activate new release + cleanup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            RELEASE_DIR="/var/www/lactocontrol_releases/${{ steps.vars.outputs.release }}"
            LIVE_LINK="/var/www/lactocontrol_web"

            chown -R www-data:www-data "$RELEASE_DIR"
            chmod -R 755 "$RELEASE_DIR"

            # Atomic symlink swap - zero downtime, no half-deployed state ever
            ln -sfn "$RELEASE_DIR" "$LIVE_LINK.tmp"
            mv -Tf "$LIVE_LINK.tmp" "$LIVE_LINK"

            nginx -t
            systemctl reload nginx

            # Keep only the 3 most recent releases to save disk space
            cd /var/www/lactocontrol_releases
            ls -dt */ | tail -n +4 | xargs -r rm -rf